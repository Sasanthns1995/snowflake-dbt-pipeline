name: CI - dbt build & test

on:
  push:
    branches:
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    
    # ⬇️⬇️⬇️ THIS TELLS GITHUB TO RUN ALL COMMANDS INSIDE dbt_project/ ⬇️⬇️⬇️
    defaults:
      run:
        working-directory: ./dbt_cicd_project

    environment: ci
    env:
      DBT_PROFILES_DIR: ./
      DBT_TARGET: ci
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CI_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_CI_DATABASE: ${{ secrets.SNOWFLAKE_CI_DATABASE }}
      SNOWFLAKE_CI_PRIVATE_KEY_PATH: /tmp/snowflake_ci_key.p8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dbt and dependencies with uv
        run: |
          uv venv
          uv pip install dbt-snowflake

      - name: Write CI private key
        run: |
          mkdir -p $(dirname ${{ env.SNOWFLAKE_CI_PRIVATE_KEY_PATH }})
          echo "${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}" > ${{ env.SNOWFLAKE_CI_PRIVATE_KEY_PATH }}
          chmod 600 ${{ env.SNOWFLAKE_CI_PRIVATE_KEY_PATH }}

      - name: Write dbt profiles.yml
        run: |
          cat > ./profiles.yml <<'EOF'
          dbt_cicd_project:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ env.SNOWFLAKE_ACCOUNT }}
                user: ${{ env.SNOWFLAKE_CI_USER }}
                private_key_path: ${{ env.SNOWFLAKE_CI_PRIVATE_KEY_PATH }}
                database: ${{ env.SNOWFLAKE_CI_DATABASE }}
                warehouse: CICD_WH
                role: SVC_CICD_ROLE
                schema: CRM_RAW
                threads: 4
          EOF

      - name: dbt deps
        run: uv run dbt deps

      - name: dbt seed
        run: uv run dbt seed --target ci

      - name: dbt run
        run: uv run dbt run --target ci

      - name: dbt test
        run: uv run dbt test --target ci
